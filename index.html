<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Lưu Hiển Dũng Space - Không gian cá nhân, ý tưởng công nghệ và các dự án phát triển cộng đồng xanh.">
  <title>Lưu Hiển Dũng | Personal Space</title>
  
  <!-- Phông chữ Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- CSS chính -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ========================================================================
       CÁC KHỐI THÀNH PHẦN LẮP GHÉP (COMPONENTS)
       Mỗi khối được tự động nạp từ thư mục components/ qua file js/app.js
       ======================================================================== -->

  <!-- 1. Thanh Menu Điều hướng đầu trang (Header) -->
  <div data-component="components/header.html" id="header-mount"></div>

  <!-- 2. Phần Giới thiệu mở đầu nổi bật (Hero Section) -->
  <main>
    <div data-component="components/hero.html" id="hero-mount"></div>

    <!-- 3. Phần Giới thiệu bản thân & Triết lý (About Section) -->
    <div data-component="components/about.html" id="about-mount"></div>

    <!-- 4. Phần Các dự án tiêu biểu (Projects Section) -->
    <div data-component="components/projects.html" id="projects-mount"></div>
  </main>

  <!-- 5. Chân trang (Footer) -->
  <div data-component="components/footer.html" id="footer-mount"></div>

  <!-- JavaScript điều khiển nạp component và hiệu ứng -->
  <script src="js/app.js"></script>

</body>
</html>
